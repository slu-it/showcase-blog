@if (userCanGenerallyEditBlogPosts) {
  @if (blogPostWasLoadedSuccessfully) {
    <app-blog-post-editor-form
      submitLabel="editor.save"
      (cancelClicked)="handleCancel()"
      (submitClicked)="handleSubmit($event)"
    />
  } @else {
    <app-error-state [status]="errorStatus!"/>
  }
} @else {
  <app-error-state [status]="403"/>
}
