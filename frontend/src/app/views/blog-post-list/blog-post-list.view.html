<div class="blog-post-list">
  @for (post of blogPosts; track post._links.self.href) {
    <div class="blog-post">
      <h2>@if (post._links.patch) {<a routerLink="/editor/{{ post.uid }}">✏️</a> }{{ post.title }}</h2>
      <p>{{ post.summary }}</p>
      <p>{{ post.publicationTime | date:"long" }}</p>
    </div>
  }
</div>
