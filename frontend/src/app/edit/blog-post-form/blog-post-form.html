<form data-testid="form" [formGroup]="form" (ngSubmit)="handleSubmit()">
  <label for="title">Title</label>
  <input data-testid="title-input" id="title" type="text" formControlName="title" />
  <label for="summary">Summary</label>
  <textarea data-testid="summary-input" id="summary" formControlName="summary"></textarea>
  <button data-testid="submit-button" type="submit" [disabled]="!form.valid">Submit</button>
</form>
<br/>
<div data-testid="message">Message: {{ message }}</div>
